# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "x-dev" ]
  pull_request:
    branches: [ "x-dev" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Workloads
        run: dotnet workload restore
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Native AOT Publish Test (with Artifacts)
        run: dotnet publish "RabotoraX.Windows.Test\RabotoraX.Windows.Test.csproj" -c Release -r win-x64 -f net10.0
      - name: Upload Native AOT Publish Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NativeAOTPublishTest
          path: RabotoraX.Windows.Test/bin/Release/net*/win-x64/publish/
          if-no-files-found: error